<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Site | Refri</title>
</head>
<body>
    <main>
        <div class="item active" style="--background: #EA3D41">
            <div class="content">Morango</div>
            <img class="fruit" src="/ASSETS/Morango-fundo.png" alt="fundo morango">
            <img class="refri" src="/ASSETS/Morango-refrigerante.png" alt="refrigerante de morango">
        </div>

        <div class="item" style="--background: #2D5643">
            <div class="content">Abacate</div>
            <img class="fruit" src="/ASSETS/Abacate-fundo.png" alt="fundo Abacate">
            <img class="refri" src="/ASSETS/Abacate-refrigerante.png" alt="refrigerante de Abacate">
        </div>

        <div class="item" style="--background: #E7A043">
            <div class="content">Laranja</div>
            <img class="fruit" src="/ASSETS/Laranja-fundo.png" alt="fundo Laranja">
            <img class="refri" src="/ASSETS/Laranja-refrigerante.png" alt="refrigerante de Laranja">
        </div>

        <div class="arrow">
            <button id="prev"> < </button>
            <button id="next"> > </button>

        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
